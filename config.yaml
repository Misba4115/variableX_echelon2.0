# ===========================================
# AUTONOMOUS SILVER PREDICTION AGENT
# Configuration File
# ===========================================

# Agent Settings
agent:
  name: "Silver Scout Agent"
  version: "2.0.0"
  poll_interval_seconds: 300  # 5 minutes
  max_retries: 3
  retry_delay_seconds: 60

# Brain Agent Trigger Settings
brain_trigger:
  enabled: true
  auto_trigger: true           # Auto-trigger when threshold met
  min_total_fresh_entries: 15  # Minimum fresh entries (price + news combined)
  check_interval_minutes: 10   # How often to check entry counts


# Stock Data Sources (StockAgent)
stock_sources:
  - name: "alpha_vantage"
    provider: "Alpha Vantage"
    symbol: "SLV"
    currency: "USD"
  
  - name: "finnhub"
    provider: "Finnhub"
    symbol: "SLV"
    currency: "USD"

# News Sources (NewsAgent)
news_sources:
  - name: "silverseek_news"
    url: "https://silverseek.com/articles/silver-market-updates"
    type: "scrape"

# LLM Configuration (GenerativeEnhancer)
llm:
  provider: "openai"
  model: "gpt-4"
  temperature: 0.3
  max_tokens: 150

# Dashboard Settings
dashboard:
  title: "Silver Prediction Agent Dashboard"
  refresh_interval_seconds: 60
  charts:
    - type: "line"
      metric: "silver_price"
      timeframe_days: 30
    - type: "bar"
      metric: "sentiment_score"
      timeframe_days: 7

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/agent.log"
